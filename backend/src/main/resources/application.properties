spring.application.name=id-generator
server.port=8080

# --- PostgreSQL (overridden by env vars in docker-compose) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/idgen}
spring.datasource.username=${DB_USER:idgen}
spring.datasource.password=${DB_PASSWORD:idgen}
spring.datasource.hikari.maximum-pool-size=20

# Versioned migrations run automatically at startup. baseline-on-migrate lets a database created before
# Flyway was introduced (tables exist, no history table) be adopted: V1 is idempotent, V2 only adds.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# "count": 2.5 must be rejected, not silently truncated to 2.
spring.jackson.deserialization.accept-float-as-int=false

# --- Application configuration (supplied data files are read-only configuration) ---
idgen.templates-path=${TEMPLATES_PATH:../data/templates.json}
idgen.cities-path=${CITIES_PATH:../data/cities.csv}
idgen.business-zone=Asia/Kolkata
idgen.max-bulk-count=1000
# Named counters ([SEQ_NAME:n]) get their start value from the "counters" section of templates.json.
# A named counter with no entry there: require-config=false -> starts at default-start;
# require-config=true -> templates using it are rejected with a clear error (the brief's strict reading).
idgen.named-counters.require-config=${NAMED_COUNTERS_REQUIRE_CONFIG:false}
idgen.named-counters.default-start=1

# --- Admin authentication ---
# Initial admin, created only if that username does not exist yet. No defaults in code.
idgen.admin.username=${ADMIN_USERNAME:}
idgen.admin.password=${ADMIN_PASSWORD:}

# Session cookie hardening. Set SESSION_COOKIE_SECURE=true when served over HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# --- External API credentials ---
# false (default): issuance stays open for the public demo UI; requests MAY send X-API-Key and are then restricted to that
# credential's tenant and templates. true: issuance requires a valid X-API-Key (or an admin session).
idgen.security.require-api-key=${API_KEY_REQUIRED:false}
